<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061329">
  <title>گپ فارسی | چت‌روم آنلاین</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #061124;
      --panel: #091a33;
      --panel-light: #102746;
      --border: #17365e;
      --blue: #3285ff;
      --cyan: #00d9f5;
      --green: #35d68b;
      --text: #e9f2ff;
      --muted: #8ba7cb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(ellipse at top, #10294c 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      height: 78px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 22px;
      background: rgba(5, 17, 36, .96);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .icon-btn {
      border: 0;
      color: var(--text);
      background: transparent;
      font-size: 27px;
      padding: 6px;
    }

    .search {
      flex: 1;
      max-width: 460px;
      margin: auto;
    }

    .search input {
      width: 100%;
      color: white;
      background: #102747;
      border: 1px solid #21436d;
      border-radius: 25px;
      padding: 13px 18px;
      outline: none;
    }

    .profile {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #547cae;
      border: 2px solid #7298c9;
      position: relative;
      display: grid;
      place-items: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .profile::after {
      content: "";
      width: 12px;
      height: 12px;
      background: var(--green);
      border: 2px solid var(--bg);
      border-radius: 50%;
      position: absolute;
      bottom: -1px;
      right: -1px;
    }

    .layout {
      max-width: 1600px;
      margin: 18px auto;
      padding: 0 12px;
      display: grid;
      grid-template-columns: 285px minmax(0, 1fr) 265px;
      gap: 14px;
      min-height: calc(100vh - 110px);
    }

    .panel {
      background: rgba(8, 25, 49, .94);
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow: hidden;
      min-width: 0;
    }

    .panel-title {
      padding: 20px 17px;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .room-list {
      padding: 8px;
    }

    .room {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 10px;
      border-bottom: 1px solid rgba(36, 67, 105, .55);
      border-radius: 12px;
      cursor: pointer;
      transition: .2s;
    }

    .room:hover {
      background: #102746;
    }

    .room.active {
      background: linear-gradient(110deg, #174b9c, #16396f);
    }

    .room-icon {
      width: 49px;
      height: 49px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #163e76;
      font-size: 24px;
      flex-shrink: 0;
    }

    .room-name {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.8;
    }

    .room-count {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .online-dot {
      color: var(--green);
    }

    .create-room {
      margin: 12px;
      width: calc(100% - 24px);
      padding: 13px;
      color: #b9d8ff;
      background: #102e57;
      border: 1px solid #214a7b;
      border-radius: 15px;
    }

    .chat {
      display: flex;
      flex-direction: column;
      min-height: 78vh;
    }

    .chat-header {
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid var(--border);
      background: #0b1d38;
    }

    .chat-room-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(145deg, #428cff, #1551b6);
      display: grid;
      place-items: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .chat-room-name {
      font-weight: bold;
      font-size: 16px;
    }

    .chat-status {
      color: var(--muted);
      font-size: 12px;
      margin-top: 7px;
    }

    .chat-status span {
      color: var(--green);
    }

    .messages {
      flex: 1;
      padding: 17px 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 380px;
      max-height: calc(100vh - 245px);
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      max-width: 100%;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: #29496d;
      border: 3px solid #4dcfff;
      color: white;
      font-size: 22px;
    }

    .bubble-wrap {
      flex: 1;
      min-width: 0;
    }

    .bubble {
      display: inline-block;
      max-width: 100%;
      background: linear-gradient(120deg, #102b4e, #0d2240);
      border-radius: 7px 18px 18px 18px;
      padding: 10px 13px;
      overflow-wrap: anywhere;
      line-height: 1.9;
    }

    .username {
      color: var(--cyan);
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .message-meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 35px 10px;
      line-height: 2;
    }

    .composer {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px;
      border-top: 1px solid var(--border);
      background: #081a32;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      color: white;
      background: #102747;
      border: 1px solid #24456e;
      border-radius: 28px;
      padding: 14px 17px;
      outline: none;
    }

    .composer input:focus {
      border-color: var(--blue);
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(145deg, #388cff, #1761dc);
      color: white;
      font-size: 22px;
    }

    .send-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .online-count {
      background: #163d71;
      border: 1px solid #2a5b98;
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 12px;
    }

    .users-list {
      padding: 8px 12px;
    }

    .user-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 3px;
      border-bottom: 1px solid rgba(36, 67, 105, .55);
      min-width: 0;
    }

    .user-avatar {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      background: #1c426b;
      border: 2px solid #36c6ec;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .user-name {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 13px;
    }

    .user-state {
      color: var(--green);
      font-size: 11px;
    }

    .users-footer {
      display: block;
      width: 100%;
      padding: 17px 10px;
      border: 0;
      background: transparent;
      color: #6daaff;
    }

    .connection {
      position: fixed;
      bottom: 12px;
      left: 12px;
      z-index: 30;
      font-size: 11px;
      color: var(--muted);
      background: #0b1d38;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 12px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .76);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 18px;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: #0b1d38;
      border: 1px solid #21436d;
      border-radius: 18px;
      padding: 24px;
    }

    .modal h2 {
      margin-top: 0;
    }

    .modal input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #294c75;
      background: #07162b;
      color: white;
      margin: 8px 0;
      outline: none;
    }

    .modal button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 10px;
    }

    .primary {
      background: #2479ee;
      color: white;
      width: 100%;
    }

    .secondary {
      background: #193655;
      color: white;
      width: 100%;
    }

    .modal-note {
      font-size: 12px;
      line-height: 1.8;
      color: var(--muted);
    }

    @media (max-width: 1000px) {
      .layout {
        grid-template-columns: 240px minmax(0, 1fr);
      }

      .users-panel {
        display: none;
      }
    }

    @media (max-width: 650px) {
      .topbar {
        height: 65px;
        padding: 0 10px;
        gap: 10px;
      }

      .search input {
        padding: 11px 13px;
      }

      .profile {
        width: 42px;
        height: 42px;
      }

      .layout {
        display: block;
        margin: 8px auto;
        padding: 0 7px;
      }

      .rooms-panel {
        margin-bottom: 10px;
      }

      .room-list {
        display: flex;
        overflow-x: auto;
        gap: 7px;
        padding: 8px;
      }

      .room {
        min-width: 165px;
        padding: 8px;
        border: 1px solid var(--border);
      }

      .room-icon {
        width: 39px;
        height: 39px;
        font-size: 20px;
      }

      .room-name {
        font-size: 12px;
      }

      .create-room {
        display: none;
      }

      .panel-title {
        padding: 12px;
        font-size: 14px;
      }

      .chat {
        min-height: calc(100dvh - 170px);
      }

      .messages {
        min-height: 45vh;
        max-height: calc(100dvh - 260px);
        padding: 12px 8px;
      }

      .avatar {
        width: 39px;
        height: 39px;
      }

      .bubble {
        font-size: 13px;
      }

      .chat-header {
        padding: 11px;
      }

      .composer {
        padding: 8px;
      }

      .connection {
        bottom: 5px;
        left: 5px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <button class="icon-btn" id="menuButton" aria-label="منو">☰</button>

    <div class="search">
      <input id="roomSearch" type="search" placeholder="جست‌وجوی اتاق‌ها...">
    </div>

    <button class="icon-btn" id="inboxButton" title="پیام‌ها">✉️</button>
    <button class="icon-btn" id="notificationButton" title="اعلان‌ها">♟</button>
    <button class="profile" id="profileButton" title="ورود یا تغییر نام">♙</button>
  </header>

  <main class="layout">
    <aside class="panel rooms-panel" id="roomsPanel">
      <div class="panel-title">
        <span>💬 اتاق‌های گفت‌وگو</span>
      </div>

      <div class="room-list" id="roomList"></div>

      <button class="create-room" id="createRoomButton">
        ＋ ساخت اتاق جدید
      </button>
    </aside>

    <section class="panel chat">
      <div class="chat-header">
        <div class="chat-room-icon" id="activeRoomIcon">⌂</div>

        <div style="flex:1; min-width:0">
          <div class="chat-room-name" id="activeRoomName">اتاق اصلی (عمومی)</div>
          <div class="chat-status" id="activeRoomStatus">
            <span>●</span> آماده اتصال
          </div>
        </div>

        <button class="icon-btn" id="chatOptions" aria-label="گزینه‌ها">⋮</button>
      </div>

      <div class="messages" id="messages">
        <div class="empty">
          به گپ فارسی خوش آمدید!<br>
          برای شروع گفت‌وگو، پیام خود را بنویسید.
        </div>
      </div>

      <form class="composer" id="messageForm">
        <button type="button" class="icon-btn" id="emojiButton" title="شکلک">☻</button>

        <input
          id="messageInput"
          type="text"
          maxlength="1500"
          autocomplete="off"
          placeholder="پیام خود را بنویسید..."
          aria-label="متن پیام"
        >

        <button class="send-btn" id="sendButton" type="submit" aria-label="ارسال پیام">
          ➤
        </button>
      </form>
    </section>

    <aside class="panel users-panel">
      <div class="panel-title">
        <span>🟢 کاربران آنلاین</span>
        <span class="online-count" id="onlineCount">۰</span>
      </div>

      <div class="users-list" id="usersList">
        <div class="empty">برای مشاهده کاربران آنلاین، نامی انتخاب کنید.</div>
      </div>

      <button class="users-footer" id="showAllUsers">
        مشاهده همه کاربران 👥
      </button>
    </aside>
  </main>

  <div class="connection" id="connectionStatus">● در انتظار اتصال</div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <h2 id="modalTitle">ورود به گپ فارسی</h2>

      <p class="modal-note" id="modalDescription">
        یک نام نمایشی انتخاب کنید تا وارد گفت‌وگو شوید.
      </p>

      <input id="nicknameInput" type="text" maxlength="24"
             autocomplete="nickname" placeholder="نام نمایشی">

      <div id="passwordArea" style="display:none">
        <input id="passwordInput" type="password"
               autocomplete="new-password" placeholder="رمز عبور">
      </div>

      <button class="primary" id="modalSubmit">ورود به گفت‌وگو</button>
      <button class="secondary" id="guestButton">ورود مهمان</button>
      <button class="secondary" id="modalClose">بستن</button>

      <p class="modal-note" id="modalMessage"></p>
    </div>
  </div>

  <script>
    /*
      تنظیمات اتصال Supabase:
      مقادیر زیر مربوط به پروژه قبلی هستند.
      کلید publishable برای کد سمت مرورگر است؛
      هرگز service_role key را در این فایل قرار ندهید.
    */
    const SUPABASE_URL = "https://fhorywjfivaemathejeq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wIM3lIEigV7J7D06-YsXAA_jM6sBknY";

    const ROOMS = [
      { id: "general", name: "اتاق اصلی (عمومی)", icon: "⌂", dbName: "عمومی" },
      { id: "friends", name: "اتاق افراد بالای ۳۰+", icon: "👥", dbName: "دوستانه" },
      { id: "youth", name: "اتاق جوانان - نوجوانان", icon: "☻", dbName: "علمی" },
      { id: "tabriz", name: "اتاق تبریز", icon: "🏛", dbName: "سرگرمی" },
      { id: "kermanshah", name: "اتاق کرمانشاه", icon: "⛰", dbName: "کرمانشاه" },
      { id: "literature", name: "اتاق شعر و ادبیات", icon: "📖", dbName: "ادبیات" },
      { id: "oldusers", name: "اتاق کاربران قدیمی", icon: "👥", dbName: "قدیمی" },
      { id: "movies", name: "اتاق فیلم و سریال", icon: "🎬", dbName: "فیلم" },
      { id: "games", name: "اتاق سرگرمی و بازی", icon: "🎮", dbName: "بازی" },
      { id: "sports", name: "اتاق ورزشی", icon: "🏋", dbName: "ورزشی" }
    ];

    const $ = id => document.getElementById(id);

    let supabaseClient = null;
    let activeRoom = ROOMS[0];
    let currentUser = localStorage.getItem("gap_username") || "";
    let guestMode = localStorage.getItem("gap_guest") === "true";
    let messageChannel = null;
    let presenceChannel = null;
    let onlineUsers = {};
    let loadedMessageIds = new Set();
    let connected = false;
    let reconnectTimer = null;

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function toPersianDigits(value) {
      return String(value).replace(/\d/g, digit => "۰۱۲۳۴۵۶۷۸۹"[digit]);
    }

    function timeText(value) {
      const date = value ? new Date(value) : new Date();
      return date.toLocaleTimeString("fa-IR", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function setConnection(text, good = false) {
      $("connectionStatus").textContent = (good ? "● " : "○ ") + text;
      $("connectionStatus").style.color = good ? "#35d68b" : "#ffbd69";
    }

    function renderRooms(filter = "") {
      const query = filter.trim().toLowerCase();

      $("roomList").innerHTML = ROOMS
        .filter(room => room.name.toLowerCase().includes(query))
        .map(room => `
          <div class="room ${room.id === activeRoom.id ? "active" : ""}"
               data-room="${escapeHTML(room.id)}">
            <div class="room-icon">${room.icon}</div>
            <div>
              <div class="room-name">${escapeHTML(room.name)}</div>
              <div class="room-count">
                <span class="online-dot">●</span>
                <span class="room-online" data-count-room="${escapeHTML(room.id)}">۰</span>
                آنلاین
              </div>
            </div>
          </div>
        `).join("");

      document.querySelectorAll(".room").forEach(element => {
        element.addEventListener("click", () => {
          const room = ROOMS.find(item => item.id === element.dataset.room);
          if (room) switchRoom(room);
        });
      });
    }

    function switchRoom(room) {
      activeRoom = room;
      loadedMessageIds.clear();
      onlineUsers = {};

      $("activeRoomName").textContent = room.name;
      $("activeRoomIcon").textContent = room.icon;
      $("messages").innerHTML = '<div class="empty">در حال دریافت پیام‌ها...</div>';

      renderRooms($("roomSearch").value);
      updateOnlineUI();

      if (supabaseClient) {
        connectRoom();
      }
    }

    function avatarFor(name) {
      const colors = ["#28517b", "#124f63", "#63427a", "#385b51", "#775b39"];
      let total = 0;
      for (const character of name) total += character.charCodeAt(0);
      return colors[total % colors.length];
    }

    function renderMessage(message) {
      const messageId = String(message.id ?? "");
      if (messageId && loadedMessageIds.has(messageId)) return;

      if (messageId) loadedMessageIds.add(messageId);

      const empty = $("messages").querySelector(".empty");
      if (empty) empty.remove();

      const username = String(message.username || "مهمان");
      const content = String(message.content || "");
      const created = message.created_at || new Date().toISOString();

      const element = document.createElement("div");
      element.className = "message";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.style.background = avatarFor(username);
      avatar.textContent = "♙";

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const name = document.createElement("div");
      name.className = "username";
      name.textContent = username;

      const text = document.createElement("div");
      text.style.whiteSpace = "pre-wrap";
      text.textContent = content;

      const meta = document.createElement("div");
      meta.className = "message-meta";
      meta.textContent = timeText(created);

      bubble.append(name, text);
      wrap.append(bubble, meta);
      element.append(avatar, wrap);

      $("messages").appendChild(element);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    async function loadMessages() {
      if (!supabaseClient) return;

      $("messages").innerHTML = '<div class="empty">در حال دریافت پیام‌ها...</div>';

      try {
        const { data, error } = await supabaseClient
          .from("messages")
          .select("id, username, room, content, created_at")
          .eq("room", activeRoom.dbName)
          .order("created_at", { ascending: true })
          .limit(100);

        if (error) throw error;

        $("messages").innerHTML = "";
        loadedMessageIds.clear();

        if (!data || data.length === 0) {
          $("messages").innerHTML =
            '<div class="empty">هنوز پیامی در این اتاق نیست.<br>اولین پیام را شما بفرستید! ✨</div>';
          return;
        }

        data.forEach(renderMessage);
      } catch (error) {
        console.error("Load messages:", error);
        $("messages").innerHTML =
          '<div class="empty">دریافت پیام‌ها ممکن نشد.<br>تنظیمات دسترسی جدول messages را بررسی کنید.</div>';
      }
    }

    function presenceKey() {
      return "gap-tab-" + Math.random().toString(36).slice(2);
    }

    const tabId = sessionStorage.getItem("gap_tab_id") ||
      (() => {
        const value = presenceKey();
        sessionStorage.setItem("gap_tab_id", value);
        return value;
      })();

    function updateOnlineUI() {
      const users = Object.values(onlineUsers);
      const unique = new Map();

      users.forEach(user => {
        if (user && user.username) {
          unique.set(user.tabId || user.username, user);
        }
      });

      const list = Array.from(unique.values());
      $("onlineCount").textContent = toPersianDigits(list.length);

      document.querySelectorAll(".room-online").forEach(node => {
        node.textContent = toPersianDigits(
          activeRoom.id === node.dataset.countRoom ? list.length : "۰"
        );
      });

      if (!list.length) {
        $("usersList").innerHTML =
          '<div class="empty">هنوز کاربر آنلاینی شناسایی نشده است.</div>';
        return;
      }

      $("usersList").innerHTML = list.map(user => `
        <div class="user-row">
          <div class="user-avatar">♙</div>
          <div class="user-name">${escapeHTML(user.username)}</div>
          <span class="user-state">●</span>
          <span>🇮🇷</span>
        </div>
      `).join("");
    }

    function connectPresence() {
      if (!supabaseClient || !currentUser) return;

      if (presenceChannel) {
        supabaseClient.removeChannel(presenceChannel);
        presenceChannel = null;
      }

      presenceChannel = supabaseClient.channel("gap-presence-" + activeRoom.dbName, {
        config: { presence: { key: tabId } }
      });

      presenceChannel
        .on("presence", { event: "sync" }, () => {
          const state = presenceChannel.presenceState();
          onlineUsers = {};

          Object.values(state).forEach(entries => {
            entries.forEach(entry => {
              onlineUsers[entry.tabId || entry.username] = entry;
            });
          });

          updateOnlineUI();
        })
        .subscribe(async status => {
          if (status === "SUBSCRIBED") {
            await presenceChannel.track({
              username: currentUser,
              tabId,
              online_at: new Date().toISOString()
            });
          }
        });
    }

    async function connectRoom() {
      if (!supabaseClient) return;

      if (messageChannel) {
        await supabaseClient.removeChannel(messageChannel);
        messageChannel = null;
      }

      if (presenceChannel) {
        await supabaseClient.removeChannel(presenceChannel);
        presenceChannel = null;
      }

      connected = false;
      setConnection("در حال اتصال...");

      await loadMessages();

      messageChannel = supabaseClient
        .channel("gap-messages-" + activeRoom.dbName)
        .on("postgres_changes", {
          event: "INSERT",
          schema: "public",
          table: "messages",
          filter: "room=eq." + activeRoom.dbName
        }, payload => {
          renderMessage(payload.new);
        })
        .subscribe(status => {
          if (status === "SUBSCRIBED") {
            connected = true;
            $("activeRoomStatus").innerHTML = '<span>●</span> اتصال زنده برقرار است';
            setConnection("متصل به گفت‌وگو", true);
          } else if (status === "CHANNEL_ERROR" ||
                     status === "TIMED_OUT" ||
                     status === "CLOSED") {
            connected = false;
            $("activeRoomStatus").textContent = "اتصال قطع شده است";
            setConnection("اتصال برقرار نیست");
            scheduleReconnect();
          }
        });

      if (currentUser) connectPresence();
    }

    function scheduleReconnect() {
      if (reconnectTimer) return;

      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        if (supabaseClient) connectRoom();
      }, 5000);
    }

    async function sendMessage(event) {
      event.preventDefault();

      const input = $("messageInput");
      const content = input.value.trim();

      if (!content) return;

      if (!currentUser) {
        openLoginModal();
        $("modalMessage").textContent = "برای ارسال پیام، ابتدا نام نمایشی انتخاب کنید.";
        return;
      }

      if (!supabaseClient) {
        alert("اتصال به سرور برقرار نیست.");
        return;
      }

      $("sendButton").disabled = true;

      try {
        const { error } = await supabaseClient
          .from("messages")
          .insert({
            username: currentUser,
            room: activeRoom.dbName,
            content
          });

        if (error) throw error;

        input.value = "";
      } catch (error) {
        console.error("Send message:", error);
        alert("پیام ارسال نشد. اتصال و دسترسی جدول messages را بررسی کنید.");
      } finally {
        $("sendButton").disabled = false;
        input.focus();
      }
    }

    function openLoginModal() {
      $("modalBackdrop").style.display = "flex";
      $("nicknameInput").value = currentUser;
      $("passwordArea").style.display = "none";
      $("modalTitle").textContent = "ورود به گپ فارسی";
      $("modalDescription").textContent =
        "یک نام نمایشی انتخاب کنید. برای ورود مهمان، نیازی به ایمیل نیست.";
      $("modalMessage").textContent = "";
      $("modalSubmit").textContent = "ورود به گفت‌وگو";
    }

    function closeModal() {
      $("modalBackdrop").style.display = "none";
    }

    function enterAsGuest() {
      const nickname = $("nicknameInput").value.trim();

      if (nickname.length < 2) {
        $("modalMessage").textContent = "نام نمایشی باید حداقل ۲ نویسه باشد.";
        return;
      }

      currentUser = nickname.slice(0, 24);
      guestMode = true;

      localStorage.setItem("gap_username", currentUser);
      localStorage.setItem("gap_guest", "true");

      closeModal();

      if (supabaseClient) connectRoom();
    }

    function showAllUsers() {
      if (window.innerWidth <= 1000) {
        alert("برای دیدن فهرست کاربران آنلاین، سایت را در صفحه بزرگ‌تر باز کنید.");
      } else {
        alert("فهرست بالا کاربران آنلاین اتاق فعلی را نمایش می‌دهد.");
      }
    }

    function setupEvents() {
      $("messageForm").addEventListener("submit", sendMessage);

      $("roomSearch").addEventListener("input", event => {
        renderRooms(event.target.value);
      });

      $("profileButton").addEventListener("click", openLoginModal);
      $("modalClose").addEventListener("click", closeModal);
      $("modalSubmit").addEventListener("click", enterAsGuest);
      $("guestButton").addEventListener("click", enterAsGuest);
      $("showAllUsers").addEventListener("click", showAllUsers);

      $("emojiButton").addEventListener("click", () => {
        $("messageInput").value += " 😊";
        $("messageInput").focus();
      });

      $("menuButton").addEventListener("click", () => {
        $("roomsPanel").scrollIntoView({ behavior: "smooth", block: "start" });
      });

      $("inboxButton").addEventListener("click", () => {
        alert("قابلیت پیام خصوصی هنوز فعال نشده است.");
      });

      $("notificationButton").addEventListener("click", () => {
        alert("وقتی پیام جدیدی در اتاق دریافت شود، در همین صفحه نمایش داده می‌شود.");
      });

      $("createRoomButton").addEventListener("click", () => {
        alert("ساخت اتاق اختصاصی هنوز فعال نشده است.");
      });

      $("chatOptions").addEventListener("click", () => {
        if (confirm("می‌خواهید نام نمایشی خود را تغییر دهید؟")) {
          openLoginModal();
        }
      });

      $("modalBackdrop").addEventListener("click", event => {
        if (event.target === $("modalBackdrop")) closeModal();
      });

      $("nicknameInput").addEventListener("keydown", event => {
        if (event.key === "Enter") enterAsGuest();
      });
    }

    async function init() {
      renderRooms();
      setupEvents();

      if (currentUser) {
        $("nicknameInput").value = currentUser;
      } else {
        setTimeout(openLoginModal, 400);
      }

      if (typeof window.supabase === "undefined") {
        setConnection("کتابخانه اتصال بارگذاری نشد");
        return;
      }

      try {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY,
          {
            realtime: {
              params: { eventsPerSecond: 10 }
            }
          }
        );

        await connectRoom();
      } catch (error) {
        console.error("Supabase initialization:", error);
        setConnection("خطا در راه‌اندازی اتصال");
      }
    }

    init();
  </script>
</body>
</html>
